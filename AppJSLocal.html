  function renderSchedule(){const ci=conflictIds(),list=filtered();$('scheduleRows').innerHTML=list.length?list.map(x=>`<tr><td><strong>${dateFmt(x.date)}</strong><small>${esc(x.startTime||'horário pendente')}${x.endTime?'–'+esc(x.endTime):''}</small></td><td><span class="tag">${esc(x.course)}</span></td><td>${esc(x.module)}${x.grade!==''?`<small>Avaliação ${esc(x.grade)}%</small>`:''}</td><td>${esc(x.teacher)}</td><td>${x.fee?money(x.fee):'—'}</td><td class="${ci.has(x.id)?'conflict':'clear'}">${ci.has(x.id)?'⚠ Verificar':'✓ Sem colisão'}</td><td><button class="button" data-edit="${esc(x.id)}">Editar</button> <button class="button" data-delete="${esc(x.id)}">×</button> <button class="button" data-export-record="${esc(x.id)}">ICS</button></td></tr>`).join(''):'<tr><td colspan="7" class="blank">Nenhum registro encontrado</td></tr>';const c=conflicts();$('conflictCount').textContent=c.length?`${c.length} alerta(s)`:'Sem conflitos';renderConflictList('conflictList',c)}
  function renderConflictList(id,list){$(id).innerHTML=list.length?list.map(([a,b])=>`<div class="item"><div><strong class="conflict">⚠ ${esc(a.teacher)} · ${dateFmt(a.date)}${a.startTime?' · '+esc(a.startTime):''}</strong><small>${esc(a.course)} · ${esc(a.module)} ${a.startTime&&a.endTime?'('+esc(a.startTime)+'–'+esc(a.endTime)+')':'(horário não informado)'}<br>${esc(b.course)} · ${esc(b.module)} ${b.startTime&&b.endTime?'('+esc(b.startTime)+'–'+esc(b.endTime)+')':'(horário não informado)'}</small></div><button data-edit="${esc(a.id)}">Revisar</button></div>`).join(''):'<div class="blank">Nenhum conflito de professor identificado.</div>'}
  function renderFinance(){const c=$('financeCourse').value,t=$('financeTeacher').value,list=records.filter(x=>(!c||x.course===c)&&(!t||x.teacher===t)).sort((a,b)=>a.date.localeCompare(b.date)),total=list.reduce((s,x)=>s+(Number(x.fee)||0),0),paid=list.filter(x=>x.status==='Pago').reduce((s,x)=>s+(Number(x.fee)||0),0);$('financeKpis').innerHTML=[[money(total),'Total cadastrado'],[money(paid),'Pago'],[money(total-paid),'Pendente'],[list.filter(x=>x.fee).length,'Módulos com valor']].map(([n,l])=>`<div class="kpi"><div class="kpi-label">${l}</div><strong>${n}</strong></div>`).join('');$('financeRows').innerHTML=list.length?list.map(x=>`<tr><td>${esc(x.course)}</td><td>${esc(x.module)}</td><td>${esc(x.teacher)}</td><td>${dateFmt(x.date)}</td><td>${x.fee?money(x.fee):'—'}</td><td><span class="tag">${esc(x.status||'Pendente')}</span></td><td><button class="button" data-edit="${esc(x.id)}">Editar</button></td></tr>`).join(''):'<tr><td colspan="7" class="blank">Nenhum lançamento</td></tr>'}
  function renderMessages(){const teacher=$('messageTeacher').value,items=records.filter(x=>x.teacher===teacher).sort((a,b)=>a.date.localeCompare(b.date));$('teacherStats').textContent=teacher?`${items.length} módulos · ${items.filter(x=>x.date>=new Date().toISOString().slice(0,10)).length} futuros`:'Selecione um professor';$('teacherModules').innerHTML=teacher&&items.length?items.map(x=>`<div class="item"><div><strong>${esc(x.module)}</strong><small>${esc(x.course)} · ${dateFmt(x.date)}${x.startTime?' · '+esc(x.startTime):''}</small></div><button data-edit="${esc(x.id)}">Editar</button></div>`).join(''):'<div class="blank">Selecione um professor para ver o espelho de aulas.</div>';if(teacher&&!$('messageText').value)makeMessage()}
  function renderReferences(){$('referenceStats').innerHTML=`<div class="kpis" style="grid-template-columns:repeat(3,1fr)"><div class="kpi"><strong>${courses().length}</strong><small>turmas distintas</small></div><div class="kpi"><strong>${teachers().length}</strong><small>professores</small></div><div class="kpi"><strong>${modules().length}</strong><small>módulos distintos</small></div></div><p class="helper">Base importada: Coordenção_ebpos.xlsx · Planilha1 · linhas com turma, professor, data e módulo. Avaliação e valor da aula foram preservados. Horário e duração não existem na origem e podem ser preenchidos ao editar.</p>`}
  function switchView(view){document.querySelectorAll('.section').forEach(x=>x.classList.toggle('active',x.id==='view-'+view));document.querySelectorAll('.nav [data-view]').forEach(x=>x.classList.toggle('active',x.dataset.view===view));const names={dashboard:'Visão geral',schedule:'Agenda de cursos e módulos',finance:'Painel financeiro',messages:'Professores e mensagens',data:'Cadastros e dados'};$('pageTitle').textContent=names[view]||'Coordenação';window.scrollTo({top:0,behavior:'smooth'})}
  function setThemeButton(){const dark=document.documentElement.dataset.theme==='dark';$('themeToggle').textContent=dark?'☀ Tema claro':'◐ Tema escuro'}
  function openEditor(r){editingId=r?.id||'';$('modalTitle').textContent=editingId?'Editar sessão':'Nova sessão';const vals={Course:'course',Teacher:'teacher',Module:'module',Date:'date',Start:'startTime',End:'endTime',Hours:'hours',Fee:'fee',Grade:'grade',Status:'status',Location:'location',Notes:'notes'};Object.entries(vals).forEach(([field,key])=>$('f'+field).value=r?.[key]??(key==='status'?'Pendente':''));$('editModal').classList.add('show')}
  function closeEditor(){$('editModal').classList.remove('show')}
  function bind(){document.querySelectorAll('[data-view]').forEach(b=>b.addEventListener('click',()=>switchView(b.dataset.view)));$('themeToggle').onclick=()=>{document.documentElement.dataset.theme=document.documentElement.dataset.theme==='dark'?'light':'dark';storageSet(THEME,document.documentElement.dataset.theme);setThemeButton()};$('addModule').onclick=()=>openEditor();googleShortcut.onclick=()=>{switchView('data');setTimeout(()=>{calendarSelect.focus();importGoogle.scrollIntoView({behavior:'smooth',block:'center'})},0)};cancelEdit.onclick=closeEditor;document.querySelectorAll('#search,#courseFilter,#teacherFilter,#fromFilter,#toFilter').forEach(x=>x.addEventListener('input',renderSchedule));$('clearFilters').onclick=()=>{['search','courseFilter','teacherFilter','fromFilter','toFilter'].forEach(id=>$(id).value='');renderSchedule()};['financeCourse','financeTeacher'].forEach(id=>$(id).onchange=renderFinance);$('messageTeacher').onchange=()=>{$('messageText').value='';renderMessages()};document.querySelectorAll('[data-msg]').forEach(b=>b.onclick=()=>{msgMode=b.dataset.msg;document.querySelectorAll('[data-msg]').forEach(x=>x.classList.toggle('active',x===b));makeMessage()});$('makeMessage').onclick=makeMessage;$('copyMessage').onclick=async()=>{try{await navigator.clipboard.writeText($('messageText').value);toast('Mensagem copiada.')}catch{toast('Não foi possível copiar o texto.')}};$('whatsappMessage').onclick=()=>window.open('https://wa.me/?text='+encodeURIComponent($('messageText').value),'_blank','noopener');$('emailMessage').onclick=()=>location.href='mailto:?subject='+encodeURIComponent(msgMode==='mirror'?'Espelho de módulos · EBPÓS':'Lembrete de aula · EBPÓS')+'&body='+encodeURIComponent($('messageText').value);$('exportAll').onclick=()=>downloadICS(records,'agenda-ebpos-completa.ics');$('exportCourseBtn').onclick=()=>{const c=$('exportCourse').value;if(!c)return toast('Selecione uma turma.');downloadICS(records.filter(x=>x.course===c),'agenda-'+slug(c)+'.ics')};$('exportModuleBtn').onclick=()=>{const m=$('exportModule').value;if(!m)return toast('Selecione um módulo.');downloadICS(records.filter(x=>x.module===m),'modulo-'+slug(m)+'.ics')};$('exportFinance').onclick=exportFinance;$('exportJson').onclick=()=>download('ebpos-coordenacao-backup.json',JSON.stringify({version:1,records},null,2),'application/json');$('downloadTemplate').onclick=()=>download('modelo-agenda-ebpos.csv','turma,professor,data,modulo,horario_inicio,horario_fim,horas,valor,avaliacao,status,local,observacoes\nESC001,Nome professor,2026-11-06,Nome do módulo,09:00,17:00,8,1200,95,Pendente,Online,\n','text/csv;charset=utf-8');$('importBtn').onclick=importFile;$('importFile').onchange=()=>{const f=$('importFile').files?.[0];if(f&&/\.xlsx?$/i.test(f.name))toast('Salve o arquivo como CSV UTF-8 para importação. XLSX requer conversão.');};$('restoreSeed').onclick=async()=>{if(!confirm('Recarregar os 136 registros originais? Isso substitui as alterações locais.'))return;storageRemove(STORE);await loadRecords();render();toast('Base inicial recarregada.')};$('resetApp').onclick=()=>{if(confirm('Apagar todos os cadastros locais?')){records=[];save();render();toast('Cadastros apagados.')}};$('refreshData').onclick=()=>{render();toast('Cadastros atualizados.')};$('importGoogle').onclick=importGoogle;$('moduleForm').onsubmit=saveForm;document.body.addEventListener('click',e=>{const edit=e.target.closest('[data-edit]'),del=e.target.closest('[data-delete]'),ex=e.target.closest('[data-export-record]');if(edit)openEditor(records.find(x=>x.id===edit.dataset.edit));if(del){if(confirm('Excluir este módulo da agenda?')){records=records.filter(x=>x.id!==del.dataset.delete);save();render()}}if(ex){const r=records.find(x=>x.id===ex.dataset.exportRecord);if(r)downloadICS([r],slug(r.course+'-'+r.module)+'.ics')}})}
  async function saveForm(e){e.preventDefault();const x={id:editingId||uid(),course:$('fCourse').value.trim(),teacher:$('fTeacher').value.trim(),module:$('fModule').value.trim(),date:$('fDate').value,startTime:$('fStart').value,endTime:$('fEnd').value,hours:Number($('fHours').value||0),fee:Number($('fFee').value||0),grade:$('fGrade').value,status:$('fStatus').value,location:$('fLocation').value,notes:$('fNotes').value};if((x.startTime&&!x.endTime)||(!x.startTime&&x.endTime)){toast('Preencha o horário inicial e final, ou deixe ambos vazios.');return}if(x.startTime&&x.endTime&&x.endTime<=x.startTime){toast('O horário final deve ser posterior ao inicial.');return}const i=records.findIndex(r=>r.id===x.id);if(i>=0)records[i]=x;else records.push(x);save();closeEditor();render();toast('Sessão salva.')}
  function makeMessage(){const teacher=$('messageTeacher').value;if(!teacher){$('messageText').value='Selecione um professor para gerar a mensagem.';return}const rows=records.filter(x=>x.teacher===teacher).sort((a,b)=>a.date.localeCompare(b.date));if(msgMode==='mirror'){$('messageText').value=`Olá, ${teacher}!\n\nSegue o espelho dos módulos previstos na EBPÓS:\n\n`+rows.map((x,i)=>`${i+1}. ${x.module}\n   Turma: ${x.course}\n   Data: ${dateFmt(x.date)}${x.startTime?' · '+x.startTime+(x.endTime?'–'+x.endTime:''):''}`).join('\n\n')+'\n\nPor favor, confira as datas e nos avise se precisar de algum ajuste.\n\nCoordenação EBPÓS.';return}const d=$('messageDate').value,c=$('messageCourse').value,chosen=rows.filter(x=>(!d||x.date===d)&&(!c||x.course===c));const x=chosen[0];$('messageText').value=x?`Olá, ${teacher}!\n\nLembrete da sua aula na EBPÓS:\nMódulo: ${x.module}\nTurma: ${x.course}\nData: ${dateFmt(x.date)}${x.startTime?'\nHorário: '+x.startTime+(x.endTime?' às '+x.endTime:''):''}${x.location?'\nLocal/link: '+x.location:''}\n\nSe precisar de alguma informação, estamos à disposição.\n\nCoordenação EBPÓS.`:`Olá, ${teacher}!\n\nEste é um lembrete da sua próxima aula na EBPÓS.\n${d?'Data: '+dateFmt(d):'Confira a data da próxima aula no espelho enviado.'}${c?'\nTurma: '+c:''}\n\nCoordenação EBPÓS.`}
  function toICSDate(date,time){return (date||'').replaceAll('-','')+'T'+(time||'0900').replace(':','')+'00'}function icsEscape(s){return String(s||'').replace(/\\/g,'\\\\').replace(/;/g,'\\;').replace(/,/g,'\\,').replace(/\n/g,'\\n')}
  function downloadICS(list,name){if(!list.length)return toast('Não há sessões para exportar.');const lines=['BEGIN:VCALENDAR','VERSION:2.0','PRODID:-//EBPOS//Coordenacao Academica//PT-BR','CALSCALE:GREGORIAN','METHOD:PUBLISH'];list.forEach(x=>{if(!x.date)return;const start=x.startTime||'09:00',end=x.endTime||String(Number(start.slice(0,2))+8).padStart(2,'0')+':'+start.slice(3);lines.push('BEGIN:VEVENT','UID:'+x.id+'@ebpos.com.br','DTSTAMP:'+new Date().toISOString().replace(/[-:]/g,'').replace(/\.\d{3}/,''),'DTSTART;TZID=America/Sao_Paulo:'+toICSDate(x.date,start),'DTEND;TZID=America/Sao_Paulo:'+toICSDate(x.date,end),'SUMMARY:'+icsEscape(x.module+' · '+x.course),'DESCRIPTION:'+icsEscape('Professor: '+x.teacher+'\\nTurma: '+x.course+'\\nMódulo: '+x.module+(x.fee?'\\nValor: '+money(x.fee):'')+(x.notes?'\\n'+x.notes:'')),...(x.location?['LOCATION:'+icsEscape(x.location)]:[]),'END:VEVENT')});lines.push('END:VCALENDAR');download(name,lines.join('\r\n'),'text/calendar;charset=utf-8');toast(`${list.length} sessão(ões) exportada(s). Horários não informados receberam 09:00–17:00; revise antes de importar.`)}
  function download(name,data,type){const a=document.createElement('a');a.href=URL.createObjectURL(new Blob([data],{type}));a.download=name;a.click();URL.revokeObjectURL(a.href)}function slug(s){return String(s||'agenda').normalize('NFD').replace(/[\u0300-\u036f]/g,'').toLowerCase().replace(/[^a-z0-9]+/g,'-').replace(/^-|-$/g,'')}
  function csvParse(text){const lines=text.replace(/^\uFEFF/,'').split(/\r?\n/).filter(Boolean);if(lines.length<2)return[];const sep=(lines[0].match(/;/g)||[]).length>(lines[0].match(/,/g)||[]).length?';':',';const parse=line=>{let a=[],v='',q=false;for(let i=0;i<line.length;i++){if(line[i]==='"'&&q&&line[i+1]==='"'){v+='"';i++}else if(line[i]==='"')q=!q;else if(line[i]===sep&&!q){a.push(v);v=''}else v+=line[i]}a.push(v);return a};const heads=parse(lines[0]).map(x=>x.trim().toLocaleLowerCase());return lines.slice(1).map(line=>{const cells=parse(line),o={};heads.forEach((h,i)=>o[h]=cells[i]||'');return normalize(o,uid())}).filter(x=>x.course&&x.teacher&&x.module&&x.date)}
  async function importFile(){const f=$('importFile').files?.[0];if(!f)return toast('Escolha um arquivo CSV ou JSON.');try{let added;if(/\.json$/i.test(f.name)){const j=JSON.parse(await f.text());added=Array.isArray(j)?j:(j.records||[]);added=added.map(normalize)}else if(/\.csv$/i.test(f.name)){added=csvParse(await f.text())}else return toast('Formato não compatível. Exporte XLSX como CSV UTF-8.');if(!added.length)return toast('Nenhum registro válido foi encontrado.');const map=new Map(records.map(x=>[`${x.course}|${x.module}|${x.teacher}|${x.date}`,x]));added.forEach(x=>map.set(`${x.course}|${x.module}|${x.teacher}|${x.date}`,{...x,id:uid()}));records=[...map.values()];save();render();toast(`${added.length} sessões importadas ou atualizadas.`)}catch(e){toast('Falha na importação: '+e.message)}}
  function exportFinance(){const lines=[['Turma','Módulo','Professor','Data','Valor','Status'].join(';'),...records.map(x=>[x.course,x.module,x.teacher,x.date,x.fee,x.status].map(v=>'"'+String(v??'').replaceAll('"','""')+'"').join(';'))];download('financeiro-ebpos.csv','\uFEFF'+lines.join('\r\n'),'text/csv;charset=utf-8')}
  function importGoogle(){if(!GAS)return toast('A importação direta requer implantação do Google Apps Script.');const c=$('courseFilter').value,t=$('teacherFilter').value,f=$('fromFilter').value,to=$('toFilter').value,list=records.filter(x=>(!c||x.course===c)&&(!t||x.teacher===t)&&(!f||x.date>=f)&&(!to||x.date<=to)&&x.startTime&&x.endTime);if(!list.length)return toast('Selecione período e turma e cadastre os horários.');const payload=list.map(x=>({title:x.module+' · '+x.course,date:x.date,startTime:x.startTime,endTime:x.endTime,course:x.course,module:x.module,teacher:x.teacher,notes:x.notes,location:x.location}));google.script.run.withSuccessHandler(r=>toast(`${r.count} eventos importados no Google Calendar.`)).withFailureHandler(e=>toast('Falha: '+e.message)).importModules(payload,$('calendarSelect').value)}
  init();
</script><script>(function(){var source=document.getElementById("app-source").textContent;var tag=document.createElement("script");tag.text=source;document.body.appendChild(tag)})();</script>
