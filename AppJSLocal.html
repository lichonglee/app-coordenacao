  function makeSurveyReport(workbook){const norm=normHeader;const resultName=workbook.SheetNames.find(x=>norm(x)==='resultado');const rawName=workbook.SheetNames.find(x=>norm(x)==='base')||workbook.SheetNames.find(x=>norm(x)!=='resultado');if(!rawName)throw new Error('Não encontrei a aba de respostas.');const base=XLSX.utils.sheet_to_json(workbook.Sheets[rawName],{header:1,defval:'',raw:true});const result=resultName?XLSX.utils.sheet_to_json(workbook.Sheets[resultName],{header:1,defval:'',raw:true}):[];let course='',teacher='',period='',overall=null,teacherAverage=null,supportAverage=null;for(const row of result){const label=norm(row[0]);if(label.startsWith('curso'))course=String(row[1]||'').trim();if(label==='professor')teacher=String(row[1]||'').trim();if(label==='media geral')overall=Number(row[1])*10;if(label==='media do professor')teacherAverage=Number(row[1])*10;if(label==='media do suporte')supportAverage=Number(row[1])*10;if(label.startsWith('curso')&&row[11]==='Data:')period=[row[12],row[14]].filter(Boolean).join('–')}if(!base.length)throw new Error('A aba de respostas está vazia.');const headers=base[0].map(norm);const criteriaIdx=headers.map((h,i)=>({h,i})).filter(x=>/^(como voce avalia|o professor|a postura e atitudes)/.test(x.h)&&!/(suporte|recomendar|indicacao|ebpos)/.test(x.h));const rows=base.slice(1).filter(row=>row.some(v=>v!==''&&v!=null));const criteria=criteriaIdx.map(({h,i})=>({label:String(base[0][i]).trim().replace(/[?\s]+$/,''),average:mean(rows.map(r=>r[i]))})).filter(x=>x.average!=null);const teacherAverageCalc=mean(criteriaIdx.flatMap(({i})=>rows.map(r=>Number(r[i])).filter(Number.isFinite)));const commentsIdx=headers.map((h,i)=>({h,i})).filter(x=>/elogios|comentarios|sugestoes|conexao com o conteudo/.test(x.h));const comments=commentsIdx.flatMap(({i})=>rows.map(r=>String(r[i]||'').trim()).filter(v=>v.length>2));if(teacherAverage==null)teacherAverage=teacherAverageCalc;return {course,teacher,period,responses:rows.length,overallAverage:overall??teacherAverage,supportAverage,teacherAverage,criteria,comments,sourceLabel:'Arquivo Excel lido',qualitativeSummary:''}}
  async function readEvaluationFile(){const f=$('evaluationFile').files?.[0];if(!f)return toast('Selecione a avaliação em Excel (.xlsx ou .xls).');if(!window.XLSX)return toast('O leitor Excel não carregou. Verifique a conexão e tente novamente.');try{const wb=XLSX.read(await f.arrayBuffer(),{cellDates:true});evaluationReport=makeSurveyReport(wb);evaluationReport.sourceLabel=f.name;persistEvaluationReport();renderEvaluation();toast('Avaliação lida e mini relatório atualizado.')}catch(e){toast('Não foi possível ler a avaliação: '+e.message)}}

  function downloadICS(list,name){if(!list.length)return toast('Não há sessões para exportar.');const lines=['BEGIN:VCALENDAR','VERSION:2.0','PRODID:-//EBPOS//Coordenacao Academica//PT-BR','CALSCALE:GREGORIAN','METHOD:PUBLISH'];list.forEach(x=>{if(!x.date)return;const start=x.startTime||'09:00',end=x.endTime||String(Number(start.slice(0,2))+8).padStart(2,'0')+':'+start.slice(3);lines.push('BEGIN:VEVENT','UID:'+x.id+'@ebpos.com.br','DTSTAMP:'+new Date().toISOString().replace(/[-:]/g,'').replace(/\.\d{3}/,''),'DTSTART;TZID=America/Sao_Paulo:'+toICSDate(x.date,start),'DTEND;TZID=America/Sao_Paulo:'+toICSDate(x.date,end),'SUMMARY:'+icsEscape(x.module+' · '+x.course),'DESCRIPTION:'+icsEscape('Professor: '+x.teacher+'\\nTurma: '+x.course+'\\nMódulo: '+x.module+(x.fee?'\\nValor: '+money(x.fee):'')+(x.notes?'\\n'+x.notes:'')),...(x.location?['LOCATION:'+icsEscape(x.location)]:[]),'END:VEVENT')});lines.push('END:VCALENDAR');download(name,lines.join('\r\n'),'text/calendar;charset=utf-8');toast(`${list.length} sessão(ões) exportada(s). Horários não informados receberam 09:00–17:00; revise antes de importar.`)}

  function csvParse(text){const lines=text.replace(/^\uFEFF/,'').split(/\r?\n/).filter(Boolean);if(lines.length<2)return[];const sep=(lines[0].match(/;/g)||[]).length>(lines[0].match(/,/g)||[]).length?';':',';const parse=line=>{let a=[],v='',q=false;for(let i=0;i<line.length;i++){if(line[i]==='"'&&q&&line[i+1]==='"'){v+='"';i++}else if(line[i]==='"')q=!q;else if(line[i]===sep&&!q){a.push(v);v=''}else v+=line[i]}a.push(v);return a};const heads=parse(lines[0]).map(x=>x.trim().toLocaleLowerCase());return lines.slice(1).map(line=>{const cells=parse(line),o={};heads.forEach((h,i)=>o[h]=cells[i]||'');return normalize(o,uid())}).filter(x=>x.course&&x.teacher&&x.module&&x.date)}

  function financeExportData(){const cols=[...$('financeColumns').selectedOptions].map(o=>o.value);if(!cols.length)throw new Error('Selecione ao menos uma coluna.');const labels={course:'Turma',module:'Módulo',teacher:'Professor',date:'Data',fee:'Valor',invoice:'Receber NF',status:'Status',hours:'Horas',grade:'Avaliação'};return {cols,labels,rows:records.filter(r=>!r.archived).map(r=>cols.map(c=>c==='date'?dateFmt(r.date):c==='invoice'?dateOnlyFmt(r.invoice):c==='fee'?Number(r.fee)||0:r[c]??''))}}function exportFinance(){try{const d=financeExportData(),lines=[d.cols.map(c=>d.labels[c]),...d.rows].map(row=>row.map(v=>'"'+String(v??'').replaceAll('"','""')+'"').join(';'));download('financeiro-ebpos.csv','\uFEFF'+lines.join('\r\n'),'text/csv;charset=utf-8')}catch(e){toast(e.message)}}function exportFinanceXls(){try{if(!window.XLSX)return toast('Biblioteca de Excel indisponível.');const d=financeExportData(),wb=XLSX.utils.book_new(),ws=XLSX.utils.aoa_to_sheet([d.cols.map(c=>d.labels[c]),...d.rows]);XLSX.utils.book_append_sheet(wb,ws,'Financeiro');XLSX.writeFile(wb,'financeiro-ebpos.xlsx')}catch(e){toast(e.message)}}function exportFinancePdf(){try{const d=financeExportData(),w=window.open('','_blank');if(!w)return toast('Permita a janela para gerar o PDF.');w.document.write('<!doctype html><html><head><meta charset="utf-8"><title>Relatório financeiro EBPÓS</title><style>body{font:12px Arial;padding:20px;color:#222}h1{font-size:18px}table{border-collapse:collapse;width:100%}th,td{border:1px solid #bbb;padding:6px;text-align:left}th{background:#eee}@media print{button{display:none}}</style></head><body><h1>Relatório financeiro EBPÓS</h1><button onclick="print()">Imprimir / Salvar em PDF</button><table><thead><tr>'+d.cols.map(c=>'<th>'+d.labels[c]+'</th>').join('')+'</tr></thead><tbody>'+d.rows.map(row=>'<tr>'+row.map(v=>'<td>'+String(v??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))+'</td>').join('')+'</tr>').join('')+'</tbody></table></body></html>');w.document.close();w.focus();setTimeout(()=>w.print(),300)}catch(e){toast(e.message)}}
